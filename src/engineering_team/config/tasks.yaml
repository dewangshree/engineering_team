design_task:
  description: >
    Produce a full technical design in markdown.
    Requirements: {requirements}
    Module name: {module_name}
    Class name: {class_name}

  expected_output: >
    Markdown design document.

  agent: engineering_lead
  output_file: output/{module_name}_design.md


code_task:
  description: >
    Implement backend module strictly from design.
    Output ONLY python code.

  expected_output: >
    Valid runnable python module.

  agent: backend_engineer
  context:
    - design_task
  output_file: output/{module_name}.py


frontend_task:
  description: >
    Create simple gradio UI for backend class.

  expected_output: >
    Valid python file.

  agent: frontend_engineer
  context:
    - code_task
  output_file: output/app.py


test_task:
  description: >
    Write pytest tests for backend module.

  expected_output: >
    Valid pytest file.

  agent: test_engineer
  context:
    - code_task
  output_file: output/test_{module_name}.py
